<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Development - Maharana Glass House</title>
    <style>
        /* Body styling */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6f8fa6, #1c2d4c); /* Gradient background */
        }
        
        /* Container for the content */
        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent background */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        /* Main title */
        h1 {
            font-size: 38px;
            color: #2e3b48;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Subheading text */
        .subheading {
            font-size: 20px;
            color: #34495e;
            margin-bottom: 25px;
        }

        /* Loader design */
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin-top: 20px;
        }

        /* Spinner animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Button styling */
        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            border-radius: 8px;
            margin-top: 30px;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #2980b9;
        }

        /* Styling for page footer */
        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ecf0f1;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Maharana Glass House</h1>
        <p class="subheading">The page is under development and will be live soon.</p>
        <div class="loader"></div>
        <a href="index.html" class="button">Back to Home</a>
    </div>

    <div class="footer">
        <p>&copy; 2025 Maharana Glass House. All rights reserved.</p>
    </div>

</body>
</html>
